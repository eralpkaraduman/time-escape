<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time Escape</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  /* Scale up without smoothing so the pixel art stays sharp on any screen. */
  canvas { display: block; image-rendering: pixelated; outline: none; }
</style>
</head>
<body>
<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
<script>
  var canvas = document.getElementById('canvas');
  // Scale the canvas by a whole number of physical pixels, so the pixel art
  // stays sharp in the itch.io frame and in fullscreen on any screen.
  // A frame smaller than the game shrinks it to fit instead.
  function fit() {
    var dpr = window.devicePixelRatio || 1;
    var w = canvas.width, h = canvas.height;
    if (!w || !h) return;
    var scale = Math.floor(Math.min(innerWidth * dpr / w, innerHeight * dpr / h));
    var cssW = scale >= 1 ? w * scale / dpr : w * Math.min(innerWidth / w, innerHeight / h);
    canvas.style.width = cssW + 'px';
    canvas.style.height = (cssW * h / w) + 'px';
  }
  window.addEventListener('resize', fit);
  var Module = { canvas: canvas, postRun: [fit] };
  // itch.io embeds the game in an iframe. Keyboard input needs focus there.
  window.addEventListener('load', function () { window.focus(); canvas.focus(); });
  canvas.addEventListener('mousedown', function () { window.focus(); canvas.focus(); });
  // Keep arrow keys and space from scrolling the itch.io page.
  window.addEventListener('keydown', function (e) {
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].indexOf(e.key) >= 0) e.preventDefault();
  });
</script>
{{{ SCRIPT }}}
</body>
</html>
